name: Daily Digest

on:
  schedule:
    - cron: "0 0 * * *"  # 08:00 UTC+8 (Beijing)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Generate and deliver digest
        env:
          OpenAI__ApiKey: ${{ secrets.OpenAI__ApiKey }}
          OpenAI__BaseUrl: ${{ secrets.OpenAI__BaseUrl }}
          OpenAI__Model: ${{ secrets.OpenAI__Model }}
          WeCom__WebhookUrl: ${{ secrets.WeCom__WebhookUrl }}
        run: dotnet run --project src/Synapse.Cli -- generate-digest

      - name: Archive digest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "chore: archive daily digest $(date +%F)"
          git push

