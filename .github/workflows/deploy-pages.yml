name: Deploy to GitHub Pages

on:
  workflow_run:
    workflows: ["Daily Digest"]
    types: [completed]
  push:
    paths:
      - 'pages/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepare data files
        run: |
          DIGEST_DATE="$(date +%Y-%m-%d)"
          DIGEST_FILE="data/digests/${DIGEST_DATE}.json"

          mkdir -p pages/_data

          if [ -f "$DIGEST_FILE" ]; then
            cp "$DIGEST_FILE" pages/_data/digest.json
            echo "Deploying with digest for ${DIGEST_DATE}"
          else
            rm -f pages/_data/digest.json
            echo "No digest for ${DIGEST_DATE}, deploying UI only"
          fi

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./pages
          publish_branch: gh-pages
          force_orphan: true
          enable_jekyll: true
