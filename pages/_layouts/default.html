<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ site.title }}</title>
  <meta name="description" content="{{ site.description }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <h1 class="site-title">{{ site.title }}</h1>
      <p class="site-desc">{{ site.description }}</p>
      {% if site.data.history %}
      <nav class="history-nav">
        <label for="history-select">📅</label>
        <select id="history-select" onchange="if(this.value)window.location.href=this.value">
          <option value="">历史日报</option>
          {% for entry in site.data.history %}
          <option value="{{ entry.date | append: '.html' | relative_url }}">
            {{ entry.date }}
          </option>
          {% endfor %}
        </select>
      </nav>
      {% endif %}
    </div>
  </header>
  <main class="container">
    {{ content }}
  </main>
  <footer class="site-footer">
    <div class="container">
      <p>Generated by <a href="https://github.com/tianvan/synapse">Synapse</a></p>
    </div>
  </footer>
</body>
</html>
